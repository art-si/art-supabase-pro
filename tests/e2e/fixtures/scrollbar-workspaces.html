<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作区滚动条验收</title>
    <style>
      body {
        margin: 0;
      }
      #scrollbar-workspaces-preview {
        padding: 16px;
      }
      .scrollbar-assistant-preview {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 16px;
        height: 560px;
      }
      .scrollbar-dashboard-preview {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      @media (max-width: 1100px) {
        .scrollbar-dashboard-preview {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="scrollbar-workspaces-preview"></div>
    <script type="module" src="./scrollbar-workspaces.ts"></script>
  </body>
</html>
