name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out pinned business modules
        run: |
          for attempt in 1 2 3 4 5; do
            if git -c http.version=HTTP/1.1 submodule update --init --recursive --depth 1 --jobs 2; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo '::error::Unable to fetch pinned business modules after 5 attempts.'
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Submodule fetch failed; retrying in ${delay}s (attempt $((attempt + 1))/5)."
            sleep "$delay"
          done
          node scripts/cloudbase-modules.mjs check
      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked host dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify production deployment configuration
        run: pnpm exec tsx --test tests/unit/deployment-isolation.test.ts
      - name: Build the production application
        env:
          VITE_OUT_DIR: docs
        run: pnpm build --mode production
      - name: Verify the generated site
        run: |
          test -s docs/index.html
          test -d docs/assets
      - name: Upload the site without committing generated files
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the existing Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
